name: Abrir zip
on:
  workflow_dispatch:
  push:
    paths: ["*.zip"]
permissions:
  contents: write
jobs:
  abrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abrir o zip e enviar os arquivos
        run: |
          unzip -oq efs-brasil-PROJETO-v8.zip
          rm -f efs-brasil-PROJETO-v8.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Arquivos do site" || echo "nada a enviar"
          git push
